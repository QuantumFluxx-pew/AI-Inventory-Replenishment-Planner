# Streamlit theme settings.
# Forces a clean light theme for every visitor (fashion-retail style:
# white space, black type, one red accent). Without this, people whose
# computer is in dark mode would see dark charts on a white page.

[theme]
base = "light"
primaryColor = "#d0021b"              # red accent: buttons, active tab, focus
backgroundColor = "#ffffff"           # page background
secondaryBackgroundColor = "#f6f6f4"  # inputs, expanders, table header
textColor = "#111111"
font = "sans serif"
