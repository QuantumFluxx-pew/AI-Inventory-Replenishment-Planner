# Streamlit theme settings.
# Forces the light theme for every visitor. Without this, people whose
# computer is in dark mode see dark charts and inputs on a white page.

[theme]
base = "light"
primaryColor = "#244b91"              # buttons, sliders, focus outlines
backgroundColor = "#f5f7fb"           # page background
secondaryBackgroundColor = "#ffffff"  # inputs, expanders, table header
textColor = "#202b43"
